[package]
name = "app"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["rlib", "cdylib"] # cdylib = libapp.so para Android (NativeActivity, lib_name "app")

[[bin]]
name = "pdri"
path = "src/main.rs"

[dependencies]
game = { path = "../game" }
winit = "0.30.13"
wgpu = "30.0.1"
pollster = "1.0.1"
serde_json = "1" # los datos de los mobs (sprite, frame, anims) que lee el render
log = "0.4.35"
bytemuck = { version = "1.25.2", features = ["derive"] }
png = "0.18.1"

[target.'cfg(not(target_os = "android"))'.dependencies]
env_logger = "0.11.11"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15.1"
winit = { version = "0.30.13", features = ["android-native-activity"] }
