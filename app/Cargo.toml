[package]
name = "app"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["rlib", "cdylib"] # cdylib = libapp.so para Android (NativeActivity, lib_name "app")

[[bin]]
name = "pdri"
path = "src/main.rs"

[dependencies]
game = { path = "../game" }
winit = "0.30.13"
wgpu = "30.0.1"
pollster = "1.0.1"
serde_json = "1" # los datos de los mobs (sprite, frame, anims) que lee el render
log = "0.4.35"
bytemuck = { version = "1.25.2", features = ["derive"] }
png = "0.18.1"
# importar mods (zip)
zip = { version = "2", default-features = false, features = ["deflate"] }
# actualizador (D4): HTTPS a las Releases de GitHub, sólo con la feature `updater`
ureq = { version = "2", optional = true, default-features = false, features = ["tls"] }

[features]
# Actualizador (D4): sólo las builds de GitHub (job release) o propias (`--features app/updater`); nunca Play ni Steam
updater = ["dep:ureq"]

[target.'cfg(not(target_os = "android"))'.dependencies]
env_logger = "0.11.11"
# el selector de archivos del sistema (importar mods)
rfd = "0.15"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15.1"
# llamar a MainActivity.pickZip (importar mods)
jni = "0.21"
winit = { version = "0.30.13", features = ["android-native-activity"] }
