name: build

on:
  push:
  pull_request:

jobs:
  desktop:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal
      - run: cargo build --release --bin pdri
      - uses: actions/upload-artifact@v4
        with:
          name: pdri-${{ matrix.os }}
          path: |
            target/release/pdri
            target/release/pdri.exe
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --target aarch64-linux-android
      - run: cargo install cargo-ndk --locked
      # Clave de firma: la del dueño desde secretos (PDRI_KEYSTORE_B64 = release.jks en base64, PDRI_KEYSTORE_PASS);
      # sin secretos (forks, PRs) se firma con una clave descartable: el APK sirve para probar, no para publicar.
      - name: clave de firma
        env:
          KS_B64: ${{ secrets.PDRI_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.PDRI_KEYSTORE_PASS }}
        run: |
          K="$RUNNER_TEMP/keys"; mkdir -p "$K"
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$K/release.jks"; PASS="$KS_PASS"
          else
            PASS=$(openssl rand -hex 16)
            keytool -genkeypair -keystore "$K/release.jks" -storetype PKCS12 -alias pddnd -keyalg RSA -keysize 2048 \
              -validity 30 -storepass "$PASS" -keypass "$PASS" -dname "CN=ci"
          fi
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=pddnd\nkeyPassword=%s\n' "$K/release.jks" "$PASS" "$PASS" > "$K/keystore.properties"
          echo "PDRI_KEYS=$K/keystore.properties" >> "$GITHUB_ENV"
      - run: ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" android/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: pdri-android
          path: target/android/pdri.apk
          if-no-files-found: error

  # D1: al llegar algo a main, Release v<versión de Cargo.toml> con los 3 archivos. Si el tag ya existe, no hace nada.
  # Sin la clave del dueño falla: un APK con la clave descartable no actualiza el instalado.
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [desktop, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: publicar
        env:
          GH_TOKEN: ${{ github.token }}
          KS_B64: ${{ secrets.PDRI_KEYSTORE_B64 }}
        run: |
          V="v$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          if gh release view "$V" >/dev/null 2>&1; then echo "$V ya existe"; exit 0; fi
          if [ -z "$KS_B64" ]; then echo "faltan los secretos PDRI_KEYSTORE_B64 / PDRI_KEYSTORE_PASS"; exit 1; fi
          mkdir out
          cp dist/pdri-ubuntu-latest/pdri out/pdri-linux-x86_64
          cp dist/pdri-windows-latest/pdri.exe out/pdri-windows-x86_64.exe
          cp dist/pdri-android/pdri.apk out/pdri-android.apk
          gh release create "$V" out/* --title "$V" --generate-notes --target "$GITHUB_SHA"
