name: build

on:
  push:
  pull_request:

# una build por rama a la vez: un push nuevo espera en cola a que termine la anterior (así su beta se publica y la
# letra de la siguiente se calcula después). GitHub deja en cola sólo la más nueva.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Nombre de la beta (canal de testers): en un push a dev, "beta-<letra>" siguiente a la última beta publicada de
  # esta versión (a, b, ... z, aa); vacío en lo demás (main, PRs: builds estables).
  beta-name:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.n.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - id: n
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != push ] || [ "$GITHUB_REF" != refs/heads/dev ]; then echo "build=" >> "$GITHUB_OUTPUT"; exit 0; fi
          V=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          LAST=$(gh release list --limit 100 --json tagName --jq ".[].tagName | select(startswith(\"v$V-beta-\")) | ltrimstr(\"v$V-beta-\")" \
            | awk '{ print length($0), $0 }' | sort -n | tail -1 | cut -d' ' -f2)
          NEXT=$(python3 -c 'import sys
          n = 0
          for c in sys.argv[1]: n = n * 26 + ord(c) - 96
          n += 1; o = ""
          while n: n -= 1; o = chr(97 + n % 26) + o; n //= 26
          print(o)' "$LAST")
          echo "build=beta-$NEXT" >> "$GITHUB_OUTPUT"

  desktop:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    needs: beta-name
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal
      # con el actualizador (D4). PDRI_REPO: un fork se actualiza de sus propias Releases. En dev, canal beta (testers):
      # la build ve las pre-releases y lleva su número (PDRI_BUILD)
      - run: cargo build --release --bin pdri --features app/updater
        env:
          PDRI_REPO: ${{ github.repository }}
          PDRI_CHANNEL: ${{ needs.beta-name.outputs.build != '' && 'beta' || '' }}
          PDRI_BUILD: ${{ needs.beta-name.outputs.build }}
      - uses: actions/upload-artifact@v4
        with:
          name: pdri-${{ matrix.os }}
          path: |
            target/release/pdri
            target/release/pdri.exe
          if-no-files-found: error

  android:
    needs: beta-name
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --target aarch64-linux-android
      - run: cargo install cargo-ndk --locked
      # Clave de firma: la del dueño desde secretos (PDRI_KEYSTORE_B64 = release.jks en base64, PDRI_KEYSTORE_PASS);
      # sin secretos (forks, PRs) se firma con una clave descartable: el APK sirve para probar, no para publicar.
      - name: clave de firma
        env:
          KS_B64: ${{ secrets.PDRI_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.PDRI_KEYSTORE_PASS }}
        run: |
          K="$RUNNER_TEMP/keys"; mkdir -p "$K"
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$K/release.jks"; PASS="$KS_PASS"
          else
            PASS=$(openssl rand -hex 16)
            keytool -genkeypair -keystore "$K/release.jks" -storetype PKCS12 -alias pddnd -keyalg RSA -keysize 2048 \
              -validity 30 -storepass "$PASS" -keypass "$PASS" -dname "CN=ci"
          fi
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=pddnd\nkeyPassword=%s\n' "$K/release.jks" "$PASS" "$PASS" > "$K/keystore.properties"
          echo "PDRI_KEYS=$K/keystore.properties" >> "$GITHUB_ENV"
      - run: ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" PDRI_FEATURES=updater android/build.sh
        env:
          PDRI_REPO: ${{ github.repository }}
          PDRI_CHANNEL: ${{ needs.beta-name.outputs.build != '' && 'beta' || '' }}
          PDRI_BUILD: ${{ needs.beta-name.outputs.build }}
      - uses: actions/upload-artifact@v4
        with:
          name: pdri-android
          path: target/android/pdri.apk
          if-no-files-found: error

  # D1: al llegar algo a main, Release v<versión de Cargo.toml> con los 3 archivos. Si el tag ya existe, no hace nada.
  # Sin la clave del dueño falla: un APK con la clave descartable no actualiza el instalado.
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [desktop, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: publicar
        env:
          GH_TOKEN: ${{ github.token }}
          KS_B64: ${{ secrets.PDRI_KEYSTORE_B64 }}
        run: |
          V="v$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          if gh release view "$V" >/dev/null 2>&1; then echo "$V ya existe"; exit 0; fi
          if [ -z "$KS_B64" ]; then echo "faltan los secretos PDRI_KEYSTORE_B64 / PDRI_KEYSTORE_PASS"; exit 1; fi
          mkdir out
          cp dist/pdri-ubuntu-latest/pdri out/pdri-linux-x86_64
          cp dist/pdri-windows-latest/pdri.exe out/pdri-windows-x86_64.exe
          cp dist/pdri-android/pdri.apk out/pdri-android.apk
          gh release create "$V" out/* --title "$V" --generate-notes --target "$GITHUB_SHA"

  # Canal beta (testers): cada push a dev publica la pre-release v<versión>-beta-<letra> (las builds de dev ya tienen el
  # actualizador en canal beta). Se guardan las 3 más nuevas.
  beta:
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: [beta-name, desktop, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: publicar beta
        env:
          GH_TOKEN: ${{ github.token }}
          KS_B64: ${{ secrets.PDRI_KEYSTORE_B64 }}
        run: |
          V="v$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)-${{ needs.beta-name.outputs.build }}"
          if [ -z "$KS_B64" ]; then echo "faltan los secretos PDRI_KEYSTORE_B64 / PDRI_KEYSTORE_PASS"; exit 1; fi
          mkdir out
          cp dist/pdri-ubuntu-latest/pdri out/pdri-linux-x86_64
          cp dist/pdri-windows-latest/pdri.exe out/pdri-windows-x86_64.exe
          cp dist/pdri-android/pdri.apk out/pdri-android.apk
          gh release create "$V" out/* --prerelease --title "$V (beta)" --notes "Beta de dev para testers: ${{ github.sha }}" --target "$GITHUB_SHA"
          gh release list --limit 50 --json tagName,isPrerelease --jq '.[] | select(.isPrerelease) | .tagName' \
            | tail -n +4 | xargs -r -n1 gh release delete --cleanup-tag -y
